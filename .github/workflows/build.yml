
name: Build POCKET iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check project files
        run: |
          pwd
          ls -la
          find . -name "project.pbxproj"

      - name: Build iOS app
        run: |
          xcodebuild \
            -project POCKET.xcodeproj \
            -scheme POCKET \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
